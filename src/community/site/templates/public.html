<section class="hero">
  <p class="kicker">{place}</p>
  <h1>{hero_title}</h1>
  <p class="lead">{hero_lead}</p>
  <div class="actions">
    {primary_action}
    {secondary_action}
  </div>
</section>

<section class="block" id="why">
  <h2>{mission_title}</h2>
  {mission}
</section>

<section class="block" id="doing">
  <h2>{doing_title}</h2>
  <div class="cards">
    {doing}
  </div>
</section>

<section class="block" id="join">
  <h2>{join_title}</h2>
  <ol class="steps">
    {steps}
  </ol>
  <p class="note">{no_invite}</p>
</section>
