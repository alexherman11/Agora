<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Two sides</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --paper:#fbfaf8; --ink:#23211e; --ink-soft:#6b6762; --ink-faint:#7d7871;
  --rule:#e6e2dc; --rule-soft:#f0ece6;
  --mine:#8a9a8f; --theirs:#9a8f8a; --ours:#8a8f9a;
  --warm:#c98f5a; --stale:#b8823c; --opaque:#b9b3ab;
  --gap:8px; --pad:20px;
  --face:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#171614; --ink:#e7e3dd; --ink-soft:#9b968e; --ink-faint:#837d75;
  --rule:#2b2925; --rule-soft:#211f1c;
  --mine:#7d9086; --theirs:#94867f; --ours:#828896;
  --warm:#d09a67; --stale:#c08f47; --opaque:#4a4640;
}}
:root[data-theme="dark"]{
  --paper:#171614; --ink:#e7e3dd; --ink-soft:#9b968e; --ink-faint:#837d75;
  --rule:#2b2925; --rule-soft:#211f1c;
  --mine:#7d9086; --theirs:#94867f; --ours:#828896;
  --warm:#d09a67; --stale:#c08f47; --opaque:#4a4640;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--face);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
header{padding:22px var(--pad) 14px;border-bottom:1px solid var(--rule)}
h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.02em}
.presence{margin-top:6px;font-size:12.5px;color:var(--ink-soft)}
.presence b{font-weight:500;color:var(--ink)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mine);
  vertical-align:middle;margin-right:5px}
.dot.away{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-faint)}

main{display:grid;grid-template-columns:1fr 1fr .82fr;gap:0;min-height:calc(100vh - 88px)}
.side{border-right:1px solid var(--rule);padding:0 var(--pad) 28px;min-width:0}
.side:last-child{border-right:0}
.sidehead{position:sticky;top:0;background:var(--paper);padding:16px 0 10px;
  border-bottom:1px solid var(--rule-soft);margin-bottom:12px;z-index:2}
.owner{display:flex;align-items:baseline;gap:8px}
.owner .name{font-size:12.5px;font-weight:500}
.owner .who{font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase}
.edge{height:2px;border-radius:2px;margin-top:8px}
.edge.alex{background:var(--theirs)} .edge.lark{background:var(--mine)} .edge.ours{background:var(--ours)}

.line{padding:9px 0 9px 11px;border-bottom:1px solid var(--rule-soft);position:relative}
.line:last-child{border-bottom:0}
.line .bar{position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:transparent}
.line.warm .bar{background:var(--warm)}
.id{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-right:7px}
.kind{font-size:11.5px;color:var(--ink-faint);margin-right:6px}
.title{font-weight:500}
.zone{color:var(--ink-soft);font-size:12.5px;margin-top:2px}
.sep{color:var(--ink-faint);padding:0 5px}
.drift{color:var(--ink-faint);font-size:12.5px;font-style:normal}

.mk{font-family:var(--mono);font-size:11.5px;margin-right:3px}
.m-eq{color:var(--ink-soft)}
.m-tilde{color:var(--ink-soft);font-style:italic}
.m-tilde .by{font-style:normal;color:var(--ink-faint);font-size:11.5px}
/* the stale flag. see lark-eyes-protocol.md §4 - contrast here is deliberate. */
.m-bang{color:color-mix(in srgb,var(--stale) 12%,var(--paper));font-size:11.5px}
.opaque{margin-top:6px;padding:7px 9px;border-radius:3px;font-size:12.5px;color:var(--ink-soft);
  background:var(--paper);border:1px solid var(--rule);
  border-left:9px solid transparent;
  background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--opaque) 5px 6px);
  background-clip:padding-box,border-box;background-origin:border-box;
  box-shadow:inset 0 0 0 99px var(--paper)}
.opaque b{font-weight:500;font-family:var(--mono);font-size:11.5px;color:var(--ink)}

.rule-line .title{font-family:var(--mono);font-size:12.5px;font-weight:400}
/* Iris, c376: this was the quietest line on the page while being the only thing that
   says the page is not showing you everything. A declaration of incompleteness must be
   at least as loud as the content it qualifies. */
.foot{margin-top:14px;font-size:12.5px;color:var(--ink);font-weight:500}
.foot code{font-family:var(--mono);font-size:11.5px}
@media (max-width:820px){main{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--rule)}}
</style>
<body>
<header>
  <h1>harbor &middot; one world, two sides</h1>
  <div class="presence" id="presence">loading&hellip;</div>
</header>
<main id="main"></main>

<script>
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function marks(p){
  let out = '';
  if (p.measured)  out += `<span class="mk m-eq">=</span><span class="m-eq">${esc(p.measured)}</span> `;
  if (p.described){
    const [txt, by] = p.described.split('|');
    out += `<span class="mk m-tilde">~</span><span class="m-tilde">&ldquo;${esc(txt.trim())}&rdquo; `
         + `<span class="by">${esc((by||'').trim())}</span></span> `;
  }
  if (p.stale) out += `<span class="mk m-bang">!</span><span class="m-bang">${esc(p.stale)}</span>`;
  return out;
}

function lineEl(node, subj){
  const p = subj.props || {};
  const warm = !!p.warm;
  const words = subj.text ? subj.text.trim().split(/\s+/).filter(Boolean).length : 0;
  const secs  = (subj.text.match(/^##\s/gm) || []).length;

  let material = [];
  if (words) material.push(`=${words}w`);
  if (secs)  material.push(`=${secs} sections`);
  if (p.rev) material.push(`=rev ${esc(p.rev)}`);
  if (p.shadowof) material.push(`shadow of ${esc(p.shadowof)}`);

  let drift = [];
  if (warm) drift.push(`${esc(p.warm)} typing &middot; ${esc(p.age||'')}`);
  if (p.unread) drift.push(`unread by ${esc(p.unread)}`);

  const isRule = /^r\d /.test(subj.title);
  return `
  <div class="line ${warm?'warm':''} ${isRule?'rule-line':''}">
    <span class="bar"></span>
    <div><span class="id">${esc(node.id)}</span><span class="kind">${esc(subj.kind)}</span><span class="title">${esc(subj.title)}</span></div>
    ${material.length||marks(p) ? `<div class="zone">${material.join('<span class="sep">&middot;</span>')}${material.length&&marks(p)?'<span class="sep">&middot;</span>':''}${marks(p)}</div>`:''}
    ${p.opaque ? `<div class="opaque"><b>?</b> ${esc(p.opaque)}</div>`:''}
    ${drift.length ? `<div class="zone drift">(${drift.join(' &middot; ')})</div>`:''}
  </div>`;
}

fetch('desk.json').then(r=>r.json()).then(d=>{
  const nodes = d.nodes, subs = d.subjects;
  const kids = id => Object.values(nodes).filter(n=>n.parent===id).sort((a,b)=>a.z-b.z);

  document.getElementById('presence').innerHTML =
    `<span class="dot"></span><b>alex</b> here, typing &middot; 4s ago`
  + ` &nbsp;&nbsp; <span class="dot away"></span><b>lark</b> here &middot; reading House rules`
  + ` &nbsp;&nbsp; <span style="color:var(--ink-faint)">rendered from <code>explore.py proto-lark --dump</code></span>`;

  const owners = {alex:'alex', lark:'lark', 'House rules':'ours'};
  const claims = {'House rules':'both signed'};
  // what the text claims about this column's fold, carried straight from the outline
  const folds  = {alex:'3 past the bottom (offscreen)'};

  const main = document.getElementById('main');
  main.innerHTML = kids('f01').map(side=>{
    const own = owners[side.title] || 'ours';
    const inner = kids(side.id).map(n=>{
      if (n.type === 'surface')
        return `<div class="line"><span class="bar"></span><div><span class="id">${n.id}</span>
                <span class="kind">surface</span><span class="title">${esc(n.title)}</span></div>
                <div class="zone">veiled from lark <span class="sep">&middot;</span> =12 inside (count only)</div></div>`;
      return lineEl(n, subs[n.subject]);
    }).join('');
    return `<section class="side">
      <div class="sidehead">
        <div class="owner"><span class="name">${esc(side.title)}</span>
          <span class="who">${own === 'ours' ? 'both' : 'owner ' + own}</span>
          ${claims[side.title]?`<span class="who">&middot; ${claims[side.title]}</span>`:''}</div>
        <div class="edge ${own === 'ours' ? 'ours' : side.title}"></div>
      </div>
      ${inner}
      ${folds[side.title]?`<div class="foot">${folds[side.title]} &middot; <code>look ${side.id} :3</code></div>`:''}
    </section>`;
  }).join('');
});
</script>
</body>
</html>
