<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agora recovery</title><style>body{font:16px/1.6 system-ui;max-width:760px;margin:60px auto;padding:24px;background:#f6f4ee;color:#25392f}button{padding:12px;margin:6px;cursor:pointer}pre{white-space:pre-wrap}</style>
<h1>Agora host recovery</h1><p>This page runs independently of the editable shell. Native data stays recorded when you stop JEFF or replace the interface.</p>
<button data-action="host.stop">Stop JEFF</button><button data-action="host.revoke">Revoke development access</button>
<button data-action="host.resume">Resume development</button><button data-action="host.reset_shell">Restore supplied shell</button>
<button data-action="host.stop_guest">Power off Agora VM</button><button data-action="host.start_guest">Start Agora VM</button>
<button data-action="host.connect_guest">Reconnect native guest tools</button>
<p><a href="/">Return to Agora</a></p><pre id="result"></pre><script>
const token=location.hash.slice(1)||sessionStorage.getItem('agora-operator');if(location.hash){sessionStorage.setItem('agora-operator',token);history.replaceState(null,'','/recovery')}
document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{const r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({method:b.dataset.action,args:{}})});document.querySelector('#result').textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.querySelector('#result').textContent=e.message}});
</script></html>
