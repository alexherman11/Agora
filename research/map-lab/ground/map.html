<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The map frame. Isolated: no network at all (connect-src none), scripts only from its own folder, no remote
     images or fonts. It reads only fixture.js beside it and the 'draw' messages its parent sends. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'none'; frame-src 'none'; form-action 'none'">
<title>Map: Bloomsbury, London</title>
<style>
  :root { --ink: #3d4651; --soft: #6b7682; --panel: rgba(255, 255, 255, .88); --line: #d6dbe0; --accent: #2a7f8f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#eaf2f6, #f5f3ec);
    font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { touch-action: none; cursor: grab; }
  #gl.dragging { cursor: grabbing; }
  #stage #plan { display: none; }          /* #stage-scoped: '#stage canvas' alone outranked a bare #plan and laid
                                             the empty plan over the 3D view, eating every drag (found by a real
                                             mouse drag on the hidden desktop, 21 Oct) */
  body.static #stage #gl { display: none; }
  body.static #stage #plan { display: block; }
  #ov { pointer-events: none; }
  #pins { position: absolute; inset: 0; pointer-events: none; }
  .pin { position: absolute; pointer-events: auto; transform: translate(-50%, -100%); border: 0; padding: 0;
    background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .pin .head { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--c, #e0603a); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    display: grid; place-items: center; }
  .pin .head span { transform: rotate(45deg); color: #fff; font: 600 11px "Segoe UI", sans-serif; }
  .pin .tag { margin-bottom: 4px; padding: 1px 6px; border-radius: 9px; background: rgba(255, 255, 255, .92);
    color: var(--ink); font-size: 11px; white-space: nowrap; box-shadow: 0 0 0 1px var(--line); order: -1; }
  .pin.sel .head, .pin:focus-visible .head { outline: 3px solid #1d4f91; outline-offset: 2px; }
  .pin.pending { opacity: .6; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 9px; box-shadow: 0 1px 4px rgba(40, 50, 60, .08); }
  #title { top: 8px; left: 8px; font-weight: 600; }
  #title small { display: block; font-weight: 400; color: var(--soft); }
  #controls { top: 8px; right: 8px; display: flex; flex-direction: column; gap: 3px; max-width: 190px; font-size: 12px; }
  #controls label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #controls button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px 8px;
    cursor: pointer; color: var(--ink); text-align: left; }
  #pinlist { list-style: none; margin: 4px 0 0; padding: 0; border-top: 1px solid var(--line); }
  #pinlist:empty { display: none; }
  #pinlist li button { width: 100%; margin-top: 3px; }
  #legend { left: 8px; bottom: 8px; max-width: min(420px, 52%); color: var(--soft); font-size: 11.5px; padding: 4px 8px; }
  #legend b { color: var(--ink); font-weight: 600; }
  #legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
  #legend .marks { display: none; }
  body.mark #legend .marks { display: block; }
  #attrib { right: 8px; bottom: 8px; font-size: 12px; padding: 3px 8px; }
  #status { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 12px; color: var(--soft); }
  #status:empty { display: none; }
  #info { top: 60px; left: 8px; max-width: 260px; display: none; font-size: 12px; }
  #info.on { display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" tabindex="0" aria-label="3D map. Drag to turn, wheel to zoom, right-drag or shift-drag to pan, double-click to drop a pin"></canvas>
  <canvas id="plan" aria-label="Flat plan of the map (static fallback)"></canvas>
  <canvas id="ov"></canvas>
  <div id="pins"></div>
</div>
<div id="title" class="panel">Bloomsbury, London<small>500 m square around the British Museum</small></div>
<div id="controls" class="panel">
  <label><input type="checkbox" id="curve"> Tiny-earth curve</label>
  <label><input type="checkbox" id="mark"> Show estimated heights</label>
  <button id="reset" type="button">Reset view</button>
  <button id="flat2d" type="button">Flat plan (no 3D)</button>
  <ul id="pinlist" aria-label="Pins"></ul>
</div>
<div id="info" class="panel" role="status"></div>
<div id="legend" class="panel"></div>
<div id="attrib" class="panel">© OpenStreetMap contributors · ODbL</div>
<div id="status" role="status"></div>
<script src="fixture.js"></script>
<script src="geo.js"></script>
<script src="map.js"></script>
</body>
</html>
