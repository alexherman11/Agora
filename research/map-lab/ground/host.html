<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; connect-src 'none'">
<title>Map stand-in sender (a7946, not the seam)</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px "Segoe UI", system-ui, sans-serif; color: #3d4651; background: #f6f4ee; }
  body { display: grid; grid-template-rows: 1fr auto; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #bar { padding: 6px 10px; border-top: 1px solid #d6dbe0; background: #fff; display: flex; gap: 10px; align-items: center; }
  #log { font: 12px Consolas, monospace; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
</style>
</head>
<body>
<!-- sandbox without allow-same-origin: the frame gets an opaque origin, so it cannot reach this page, its storage,
     or anything this page can reach. Only postMessage crosses. -->
<iframe id="map" src="map.html" sandbox="allow-scripts" title="Map"></iframe>
<div id="bar"><b>Stand-in sender</b><span>(test pins, not world notes)</span><span id="log"></span></div>
<script src="host.js"></script>
</body>
</html>
