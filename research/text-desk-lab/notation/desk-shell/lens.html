<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- OWNER: Pike (from 25 Sep). The generic painter for scene.py. It knows no app. It may never learn one.
     ?session=lens&as=alex&lens=notes   Everything it draws comes from /api/scene; every look comes from a role. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* layout mechanics only: no colour, no size, no font may appear here */
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-columns: 1fr minmax(0, 40%); grid-template-rows: minmax(0, 1fr) 2em; }
  body[data-inspector="off"] { grid-template-columns: minmax(0, 1fr); }
  body[data-inspector="off"] #said { display: none; }
  /* term.js: the right-hand pane is a desk terminal by default; ?side=scene shows the scene text, ?inspect=0 neither */
  body[data-inspector="term"] #said { display: none; }
  #term { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; box-sizing: border-box; }
  #term .term-out { flex: 1; overflow: auto; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #term .term-line { display: flex; align-items: baseline; }
  #term input { flex: 1; min-width: 0; font: inherit; color: inherit; background: transparent; border: 0; outline: none; padding: 0; }
  #term .term-head { display: flex; justify-content: flex-end; }
  body[data-inspector="off"] #term { display: none; }
  #term-open { position: fixed; top: 0.5rem; right: 0.5rem; z-index: 11; }
  #paint, #said { overflow: auto; min-width: 0; }
  /* the painted root is a flex item of the window: with `share` it takes the window's height and its shares split it
     (Alex, 29 Sep: no infinite scroll, the window is bounded); without one it keeps its own height and #paint scrolls */
  #paint { height: 100%; min-height: 0; display: flex; flex-direction: column; grid-column: 1; grid-row: 1; }
  #said, #term { grid-column: 2; grid-row: 1; min-height: 0; }
  #paint > [data-key] { flex-shrink: 0; }
  .l-grid[data-bounded] > [data-key] { min-height: 0; }
  /* the live refusal region (codex team, pike-8): announced to screen readers; shown when the inspector is off */
  #status { grid-column: 1 / -1; grid-row: 2; min-width: 0; max-height: 2em; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; box-sizing: border-box; }
  body:has(#status:not([hidden])) #door.door-fixed { visibility: hidden; }
  body[data-inspector="on"] #status { clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; }
  #said { white-space: pre; margin: 0; }
  .l-column { display: flex; flex-direction: column; }
  .l-row { display: flex; flex-direction: row; flex-wrap: wrap; align-items: baseline; }
  .l-row > [data-share] { align-self: stretch; }   /* a part given a share of a row fills its height (lens.js) */
  .l-grid { display: grid; align-items: start; }
  .l-grid > [data-key] { min-width: 0; }
  .l-cells { display: contents; }
  [data-folded="1"] > [data-key]:not([data-peek]) { display: none; }   /* `peek`: a summary a folded part keeps showing */
  [data-folded="1"] > [data-peek-lines] { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--peek-lines); overflow: hidden; }
  [data-folded="1"] { flex: 0 0 auto !important; }
  /* the painter's own buttons (fold handles) wear only their role: the browser's button box is not a look anyone chose */
  /* door.js (a1505): the quiet line of what code changed today; in the terminal's head, else at the bottom right */
  #door { position: relative; min-width: 0; flex: 1; display: flex; gap: 1ch; }
  #door.door-fixed { position: fixed; right: 0.5rem; bottom: 0.25rem; z-index: 9; max-width: min(80ch, 60vw); flex: none; }
  #door .door-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 100%; }
  #door .door-act { white-space: nowrap; flex: none; }
  #door .door-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 13;
    max-height: 60vh; overflow: auto; white-space: pre-wrap; box-sizing: border-box; }
  #door.door-fixed .door-list { top: auto; bottom: 100%; left: auto; width: max-content; max-width: min(90ch, 90vw); }
  :where(#paint button, #menu-pop button, #door button) { appearance: none; background: none; border: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }   /* a folded part gives up its share: its siblings take the room */
  /* fold ... float: a menu, its open contents drawn over the page below the handle */
  .l-float { position: relative; }
  /* a part's own menu (on menu "<label>" do ...), at the pointer */
  #menu-pop textarea, .menu-draft textarea { font: inherit; color: inherit; background: transparent; border: 0; resize: vertical; width: 36ch; max-width: 80vw; box-sizing: border-box; }
  .menu-draft { position: fixed; z-index: 20; display: flex; flex-direction: column; box-sizing: border-box; }
  .menu-draft[hidden], .composer-actions[hidden] { display: none; }
  .explicit-composer textarea { display: block; width: 100%; box-sizing: border-box; resize: vertical; font: inherit; color: inherit; background: transparent; border: 0; }
  .explicit-composer textarea:focus-visible { outline: 2px solid var(--t-focus, currentColor); outline-offset: 2px; border-radius: .3em; }
  .explicit-composer[data-composing="true"] { opacity: 1 !important; } /* an open draft outlives a shy role's hover */
  .composer-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5em; }
  .composer-actions button:disabled { opacity: .5; cursor: default; }
  .picture-stage { position: relative; }
  .picture-stage > svg, .picture-stage > img { display: block; width: 100%; height: auto; }
  .picture-region { position: absolute; box-sizing: border-box; pointer-events: none; background: transparent !important; }
  /* A style's `at N%` mixes an opaque colour with paper; actual overlays need alpha.
     Keep the role's outline solid and tint only its interior, using the role's ink. */
  .picture-region::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .12; pointer-events: none; }
  #menu-pop { position: fixed; z-index: 20; display: flex; flex-direction: column; min-width: 12ch; box-sizing: border-box; }
  .l-float > [data-key] { position: absolute; top: 100%; left: 0; z-index: 12; width: max-content; max-width: min(72ch, 90vw);
    max-height: 70vh; overflow: auto; box-sizing: border-box; }
  .l-float > [data-peek] { position: static; width: auto; max-height: none; }   /* a peek stays beside the handle, in the page */
  /* fold ... inline (a5359): the handle and the peek share the first line; what the fold hides opens below them, easing in */
  [data-fold-inline] { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .5em; align-items: baseline; }
  [data-fold-inline] > button { grid-column: 1; }
  [data-fold-inline] > [data-key] { grid-column: 1 / -1; }
  [data-fold-inline] > [data-key][data-peek] { grid-column: 2; }
  [data-fold-inline] > [data-peek] { cursor: pointer; }
  [data-fold-inline]:not([data-folded="1"]) > [data-key]:not([data-peek]) { animation: l-unfold 180ms ease-out; }
  @keyframes l-unfold { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { [data-fold-inline]:not([data-folded="1"]) > [data-key]:not([data-peek]) { animation: none; } }
  [data-now]::after { content: "   now: " attr(data-now); color: var(--t-hush); }   /* both sides, on the card (c359) */
  [data-hint]:empty::before { content: attr(data-hint); color: var(--t-hush); }
  .l-free { position: relative; flex: 1; min-height: 900px; min-width: 1700px; }
  .boxed { position: absolute; box-sizing: border-box; overflow: hidden; margin: 0; }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
  [data-clamped][data-cut="1"], [data-clamped][data-opened="1"] { cursor: pointer; }
  /* `scroll none` (a5496): never scrolls; a part cut at its foot fades there, so the eye knows there is more */
  /* and it keeps inside its parent: it may shrink below its words, and a row of it is one line (a wrapping row's line
     grows as tall as its tallest child, which pushed a column of panels off the screen) */
  [data-scroll="none"] { min-height: 0; min-width: 0; }
  .l-row[data-scroll="none"] { flex-wrap: nowrap; }
  [data-scroll="none"][data-cut="1"] { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 3em), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 3em), transparent); }
  /* `scroll none end`: the end in view, cut (and faded) at the head; what overflows a flex-end column's start is unreachable */
  .l-column[data-at-end="1"] { justify-content: flex-end; }
  .l-column[data-at-end="1"] > [data-key] { flex-shrink: 0; }
  [data-at-end="1"][data-cut="1"] { -webkit-mask-image: linear-gradient(to top, #000 calc(100% - 3em), transparent); mask-image: linear-gradient(to top, #000 calc(100% - 3em), transparent); }   /* a cut text opens on a press, and closes */
  :where(mark[data-light]) { background: none; color: inherit; }   /* `light`: a passage's look is its role's */
  [data-key] { white-space: pre-line; }
  [data-drag], [data-carry] { cursor: grab; touch-action: none; }
  /* a5994: where a carried thing will land, drawn while it is in the air (the receiver's half on the side its act
     names, or the whole receiver). Its look is the style's role `landing` when the style has one; this is the floor */
  .landing-box { position: fixed; pointer-events: none; z-index: 29; box-sizing: border-box; border-radius: 10px;
    border: 2px solid var(--t-accent, currentColor); background: color-mix(in srgb, var(--t-accent, #888) 16%, transparent); }
  .t-verbatim { white-space: pre; overflow-x: auto; }
  .t-picture { white-space: normal; } .t-picture > svg { display: block; width: 100%; height: auto; font: inherit; fill: currentColor; }   /* `picture`: a drawing as wide as its part */
  /* `media` (a5941, media.js): films and pictures under the words, or one filling its part (`media player`). Sizes
     follow the part (%, em); the look (colour, edge, the buttons) is the roles media, tool and meta. The one exception
     to "no colour here": a film's letterbox is black and its play disc white on dark, as every video's is, so the
     button reads over any picture whatever the style */
  .t-media { display: flex; flex-direction: column; gap: .5em; margin-top: .5em; white-space: normal; user-select: none; }
  .media-item { margin: 0; max-width: 32em; display: flex; flex-direction: column; overflow: hidden; }
  .media-stage { position: relative; display: grid; place-items: center; background: #000; }
  .media-stage > video, .media-stage > img { display: block; width: 100%; height: auto; max-height: 24em; object-fit: contain; }
  .media-item .media-stage > video:not([controls]), .media-item .media-stage > img { cursor: pointer; }
  .media-play { position: absolute; inset: 0; margin: auto !important; width: 3.2em; height: 3.2em; border-radius: 50% !important;
    display: grid !important; place-items: center; text-align: center !important; color: #fff !important; background: rgba(0,0,0,.55) !important; }
  .media-play[hidden] { display: none !important; }
  .media-play svg { width: 1.6em; height: 1.6em; margin-left: .15em; }
  .media-bar { display: flex; align-items: center; gap: .75em; padding: .35em .6em; min-width: 0; }
  .media-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .media-time { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .media-button { white-space: nowrap; }
  .media-button svg { width: 1.2em; height: 1.2em; display: block; }
  .media-player { margin: 0; height: 100%; min-height: 0; display: flex; flex-direction: column; outline: none; }
  .media-player > .media-stage { flex: 1; min-height: 0; }
  .media-player > .media-stage > video, .media-player > .media-stage > img { width: 100%; height: 100%; max-height: none; }
  .media-player[data-full] { position: fixed; inset: 0; z-index: 30; }
  .media-seek { flex: 3; min-width: 6em; accent-color: var(--t-accent, currentColor); }
  .media-speeds { display: flex; gap: .25em; }
  .media-speeds > [data-on] { text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
  /* `live` (a5530): the painter's clock and counts; `until ring` a ring that empties, the time left inside it */
  .t-live { font-variant-numeric: tabular-nums; }
  .t-ring { position: relative; display: grid; place-items: center; aspect-ratio: 1; width: 100%; max-width: 9em; margin-inline: auto; white-space: nowrap; }
  .t-ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .t-ring circle { fill: none; stroke-width: 5; }
  .t-ring .ring-track { stroke: currentColor; opacity: 0.13; }
  .t-ring .ring-arc { stroke: var(--t-accent, currentColor); stroke-linecap: round; stroke-dasharray: 1 1; transition: stroke-dashoffset 1s linear; }
  .t-ring[data-ended] .ring-arc { opacity: 0; }     /* a round cap would leave a dot at zero */
  .t-live[data-ended] { animation: live-end 1.8s ease-in-out 3; }
  @keyframes live-end { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .t-ring .ring-arc { transition: none; } .t-live[data-ended] { animation: none; } }
  [data-focus] [contenteditable]:focus { outline: 1px solid var(--t-focus); outline-offset: 2px; }
  [data-tool] { cursor: pointer; user-select: none; }
  [data-pressed] { opacity: 0.45; }   /* a press that is on its way to the desk */
  /* marks in a text (a3486): weight and slant are the reader's own signs, so they are not roles of a style */
  .t-mark-strong { font-weight: 700; } .t-mark-stress { font-style: italic; }
  .t-mark-link { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; color: inherit; }
  /* a6109: an id drawn as its thing's name: quiet, the words' own colour, a faint underline that firms on hover */
  .t-mark-thing { color: inherit; text-decoration: underline; text-decoration-style: dotted; text-decoration-color: color-mix(in srgb, currentColor 45%, transparent); text-underline-offset: 3px; }
  .t-mark-thing[data-thing]:not([data-thing=""]) { cursor: pointer; }
  .t-mark-thing:hover { text-decoration-style: solid; text-decoration-color: currentColor; }
  /* scrollbars from the style (Alex, 30 Sep: skinny square bars that fit the theme). A style with a `scrollbar` token
     (the thumb's colour) and `scrollbar_w` (its width) draws them; without one the browser's own stay. */
  [data-bars] ::-webkit-scrollbar { width: var(--t-scrollbar_w); height: var(--t-scrollbar_w); background: transparent; }
  [data-bars] ::-webkit-scrollbar-thumb { background: var(--t-scrollbar); border-radius: 0; }
  [data-bars] ::-webkit-scrollbar-track, [data-bars] ::-webkit-scrollbar-corner { background: transparent; }
  @supports not selector(::-webkit-scrollbar) { [data-bars] * { scrollbar-width: thin; scrollbar-color: var(--t-scrollbar) transparent; } }
</style>
</head>
<body class="r-desk">
<main id="paint"></main>
<pre id="said" class="r-source"></pre>
<div id="status" class="r-said" role="status" aria-live="polite" hidden></div>
<script src="style/style.js"></script>
<script src="viewer.js"></script>
<script src="door.js"></script>
<script src="image-comments.js"></script>
<script src="markdown.js"></script>
<script src="media.js"></script>
<script src="lens.js"></script>
<script src="term.js"></script>
</body>
</html>
