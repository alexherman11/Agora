<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- OWNER: Pike (from 25 Sep). The generic painter for scene.py. It knows no app. It may never learn one.
     ?session=lens&as=alex&lens=notes   Everything it draws comes from /api/scene; every look comes from a role. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* layout mechanics only: no colour, no size, no font may appear here */
  html, body { margin: 0; height: 100%; }
  body { display: grid; grid-template-columns: 1fr minmax(0, 40%); }
  body[data-inspector="off"] { display: block; }
  body[data-inspector="off"] #said { display: none; }
  /* term.js: the right-hand pane is a desk terminal by default; ?side=scene shows the scene text, ?inspect=0 neither */
  body[data-inspector="term"] #said { display: none; }
  #term { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; box-sizing: border-box; }
  #term .term-out { flex: 1; overflow: auto; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #term .term-line { display: flex; align-items: baseline; }
  #term input { flex: 1; min-width: 0; font: inherit; color: inherit; background: transparent; border: 0; outline: none; padding: 0; }
  #term .term-head { display: flex; justify-content: flex-end; }
  body[data-inspector="off"] #term { display: none; }
  #term-open { position: fixed; top: 0.5rem; right: 0.5rem; z-index: 11; }
  #paint, #said { overflow: auto; min-width: 0; }
  /* the painted root is a flex item of the window: with `share` it takes the window's height and its shares split it
     (Alex, 29 Sep: no infinite scroll, the window is bounded); without one it keeps its own height and #paint scrolls */
  #paint { height: 100%; display: flex; flex-direction: column; }
  #paint > [data-key] { flex-shrink: 0; }
  .l-grid[data-bounded] > [data-key] { min-height: 0; }
  /* the live refusal region (codex team, pike-8): announced to screen readers; shown when the inspector is off */
  #status { position: fixed; inset: auto 1rem 1rem auto; z-index: 10; max-width: min(60ch, calc(100vw - 2rem));
    max-height: 30vh; overflow: auto; white-space: pre-wrap; box-sizing: border-box; }
  body[data-inspector="on"] #status { clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; }
  #said { white-space: pre; margin: 0; }
  .l-column { display: flex; flex-direction: column; }
  .l-row { display: flex; flex-direction: row; flex-wrap: wrap; align-items: baseline; }
  .l-row > [data-share] { align-self: stretch; }   /* a part given a share of a row fills its height (lens.js) */
  .l-grid { display: grid; align-items: start; }
  .l-grid > [data-key] { min-width: 0; }
  .l-cells { display: contents; }
  [data-folded="1"] > [data-key]:not([data-peek]) { display: none; }   /* `peek`: a summary a folded part keeps showing */
  [data-folded="1"] { flex: 0 0 auto !important; }
  /* the painter's own buttons (fold handles) wear only their role: the browser's button box is not a look anyone chose */
  /* door.js (a1505): the quiet line of what code changed today; in the terminal's head, else at the bottom right */
  #door { position: relative; min-width: 0; flex: 1; display: flex; gap: 1ch; }
  #door.door-fixed { position: fixed; right: 0.5rem; bottom: 0.25rem; z-index: 9; max-width: min(80ch, 60vw); flex: none; }
  #door .door-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 100%; }
  #door .door-act { white-space: nowrap; flex: none; }
  #door .door-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 13;
    max-height: 60vh; overflow: auto; white-space: pre-wrap; box-sizing: border-box; }
  #door.door-fixed .door-list { top: auto; bottom: 100%; left: auto; width: max-content; max-width: min(90ch, 90vw); }
  :where(#paint button, #menu-pop button, #door button) { appearance: none; background: none; border: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }   /* a folded part gives up its share: its siblings take the room */
  /* fold ... float: a menu, its open contents drawn over the page below the handle */
  .l-float { position: relative; }
  /* a part's own menu (on menu "<label>" do ...), at the pointer */
  #menu-pop { position: fixed; z-index: 20; display: flex; flex-direction: column; min-width: 12ch; box-sizing: border-box; }
  .l-float > [data-key] { position: absolute; top: 100%; left: 0; z-index: 12; width: max-content; max-width: min(72ch, 90vw);
    max-height: 70vh; overflow: auto; box-sizing: border-box; }
  .l-float > [data-peek] { position: static; width: auto; max-height: none; }   /* a peek stays beside the handle, in the page */
  [data-now]::after { content: "   now: " attr(data-now); color: var(--t-hush); }   /* both sides, on the card (c359) */
  [data-hint]:empty::before { content: attr(data-hint); color: var(--t-hush); }
  .l-free { position: relative; flex: 1; min-height: 900px; min-width: 1700px; }
  .boxed { position: absolute; box-sizing: border-box; overflow: hidden; margin: 0; }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
  [data-key] { white-space: pre-line; }
  [data-drag], [data-carry] { cursor: grab; touch-action: none; }
  .t-verbatim { white-space: pre; overflow-x: auto; }
  /* scrollbars from the style (Alex, 30 Sep: skinny square bars that fit the theme). A style with a `scrollbar` token
     (the thumb's colour) and `scrollbar_w` (its width) draws them; without one the browser's own stay. */
  [data-bars] ::-webkit-scrollbar { width: var(--t-scrollbar_w); height: var(--t-scrollbar_w); background: transparent; }
  [data-bars] ::-webkit-scrollbar-thumb { background: var(--t-scrollbar); border-radius: 0; }
  [data-bars] ::-webkit-scrollbar-track, [data-bars] ::-webkit-scrollbar-corner { background: transparent; }
  @supports not selector(::-webkit-scrollbar) { [data-bars] * { scrollbar-width: thin; scrollbar-color: var(--t-scrollbar) transparent; } }
</style>
</head>
<body class="r-desk">
<main id="paint"></main>
<pre id="said" class="r-source"></pre>
<div id="status" class="r-said" role="status" aria-live="polite" hidden></div>
<script src="style/style.js"></script>
<script src="viewer.js"></script>
<script src="door.js"></script>
<script src="lens.js"></script>
<script src="term.js"></script>
</body>
</html>
