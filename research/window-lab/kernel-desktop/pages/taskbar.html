<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agora taskbar</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="kd.css"><link rel="stylesheet" href="bars.css">
</head><body class="dock">
  <div class="group" id="shell"></div>
  <div class="sep"></div><div class="group" id="pins" aria-label="Pinned things"></div>
  <div class="sep"></div><div class="group tasks" id="wins" aria-label="Running windows"></div>
  <div class="grow"></div><div class="group" id="holds"></div>
  <div class="group tray" id="tray" aria-label="System tray"></div>
  <div class="group" id="clock-slot"></div><div class="group" id="off-slot"></div>
  <div class="say" id="say" role="status"></div>
<script src="kd.js"></script><script src="theme-live.js"></script><script src="taskbar.js"></script>
<script src="widget-slots.js"></script></body></html>
