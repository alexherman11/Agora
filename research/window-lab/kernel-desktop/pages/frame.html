<!doctype html>
<html><head><meta charset="utf-8"><title>Agora</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="kd.css">
<style>
  iframe { flex: 1; border: 0; width: 100%; background: var(--paper); }
</style></head>
<body>
<!-- The frame a lens window sits in: the window's strip (drag, tuck away, close), and lens.js itself, unchanged, painting
     the lens from the kernel's painter routes. The session is the same cookie, so the lens acts as Alex. -->
<iframe id="lens" title="lens"></iframe>
<script src="kd.js"></script><script src="menu.js"></script><script src="theme-live.js"></script>
<script>
"use strict";
const name = KD.q.get("name") || KD.q.get("lens") || "Lens";
KD.chrome(name);
const lens = encodeURIComponent(KD.q.get("lens") || "");
document.getElementById("lens").src = `/lens.html?lens=${lens}&inspect=0`;
</script>
</body></html>
