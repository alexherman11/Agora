<!doctype html><meta charset="utf-8"><title>Agora widget</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="kd.css">
<style>html,body{margin:0;height:100%;overflow:hidden}body{display:flex;flex-direction:column}#widget-surface{flex:1;min-height:0;position:relative;padding:0;overflow:hidden}#widget-surface iframe{width:100%;height:100%;border:0;display:block}#receipt{font:11px var(--ag-font-ui,'Segoe UI',sans-serif);background:var(--ag-hover,#eef3f1);color:var(--ag-ink-muted,#496357);padding:5px 12px;min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.quiet-receipts #receipt,body.slot #receipt,body.overlay #receipt{display:none}body.overlay,body.slot{border:0;border-radius:0}body.overlay,body.overlay #widget-surface{background:transparent!important}</style>
<main id="widget-surface"></main><div id="receipt" role="status">Every change has a line.</div>
<script src="kd.js"></script><script src="menu.js"></script><script src="theme-live.js"></script><script src="widget-host.js"></script>
