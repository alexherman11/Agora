# Seabright community board: /etc/nginx/sites-available/seabright (enabled by symlink). Only this one name.
# Public 443 reaches the https block through the SNI stream proxy (/etc/nginx/stream-sni-proxy.conf) at 127.0.0.1:8444.
# Kernel door 127.0.0.1:8810 (seabright-kernel), entry service 127.0.0.1:8817 (seabright-entry).
# research/community-app/board/PUBLIC-HOST.md says which paths go where and why. Claude, 5 Nov 2026.
server {
    listen 80;
    listen [::]:80;
    server_name seabright.example.org;
    location /.well-known/acme-challenge/ { root /srv/seabright/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8444 ssl http2;
    listen [::1]:8444 ssl http2;
    server_name seabright.example.org;
    ssl_certificate /etc/letsencrypt/live/seabright.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seabright.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 40M;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # the QR code printed for the meeting: keep this path working all night (see /srv/seabright/meeting.conf)
    location = /meeting {
        root /srv/seabright/holding;
        add_header Cache-Control "no-store" always;
        include /srv/seabright/meeting.conf;
    }

    # never from outside: the kernel's and entry's private seam
    location ^~ /internal/ { return 404; }
    location ^~ /keep/ { return 404; }
    location = /dev/signin { return 404; }

    # entry service: public site pages, sign-in, invites, account
    location = /about { proxy_pass http://127.0.0.1:8817; }
    location ~ ^/(privacy|join|signin|signout|welcome|account|home)(/|$) { proxy_pass http://127.0.0.1:8817; }
    location ^~ /auth/ { proxy_pass http://127.0.0.1:8817; }
    location ^~ /leader/ { proxy_pass http://127.0.0.1:8817; }
    location ^~ /entry-static/ { proxy_pass http://127.0.0.1:8817; }

    # kernel: the board and the door it speaks through
    location = /board { proxy_pass http://127.0.0.1:8810; }
    location ~ ^/(desk|files|api|web)(/|$) { proxy_pass http://127.0.0.1:8810; }
    location ~ ^/(do|see|upload|lens\.html|health)$ { proxy_pass http://127.0.0.1:8810; }
    location ~ ^/(door/stream|stream)$ {
        proxy_pass http://127.0.0.1:8810;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # the public face: Alex's website (static files in /srv/seabright/website)
    location = / {
        root /srv/seabright/website;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ^~ /_next/ { root /srv/seabright/website; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ^~ /images/ { root /srv/seabright/website; }
    location ^~ /explore/ { root /srv/seabright/website; try_files $uri $uri/ $uri.html =404; }
    location = /favicon.svg { root /srv/seabright/website; }

    # anything else: the holding page (no 404s for neighbours with an old link)
    location / {
        root /srv/seabright/holding;
        add_header Cache-Control "no-store" always;
        rewrite ^ /index.html break;
    }
}
