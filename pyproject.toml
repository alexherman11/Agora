[project]
name = "agora3"
version = "0.0.0"
description = "A programmable computing environment shared with JEFF"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agora3 = "agora3.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/agora3"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["worlds", "machines", "artifacts", "local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
