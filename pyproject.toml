[project]
name = "agora"
version = "0.1.0"
description = "A personal operating system you can reshape while you use it, shared with a resident AI"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.26.0",
    "openai-codex==0.147.0",
    "websockets==15.0.1",
    "pypdf==6.21.2",
    "Pillow==12.3.0",
    "loro==1.17.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff==0.16.6", "pytest==9.1.1", "pycdlib==1.14.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["worlds", "local", "src/text-desk/notation/sessions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["src/agora/tests"]
pythonpath = ["."]
